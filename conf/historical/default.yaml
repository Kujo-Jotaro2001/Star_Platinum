# Historical data loader — downloads from quote-saver.bycsi.com
# Source provides order book snapshots at 10ms cadence; we downsample to snapshot_interval_ms.

start_date: "2025-08-07"
end_date: "2025-08-20"
base_url: "https://quote-saver.bycsi.com"

# Target snapshot cadence after downsampling. Must be a multiple of 10 (source cadence).
snapshot_interval_ms: 100

# Source archives are cached here and fed verbatim to hftbacktest.
raw_dir: "data/raw"
