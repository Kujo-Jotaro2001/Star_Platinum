batch_size: 1024
max_epochs: 12
lr: 1.0e-3
weight_decay: 1.0e-4
patience: 3
grad_clip_val: 1.0
use_focal_loss: false
focal_gamma: 2.0
val_metric: "val_f1_macro"
seed: 42

# One training window per second. Neighbours at the 100 ms cadence overlap by
# more than 98%, so training on every one costs an order of magnitude of compute
# for almost no extra information.
window_stride: 10

# Zero on purpose: Windows spawns dataloader workers, and pickling a memmap
# slice materialises it, giving every worker its own multi-GB copy of the split.
num_workers: 0
