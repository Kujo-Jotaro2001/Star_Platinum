[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "star-platinum"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pybit>=5.9",
    "aiosqlite>=0.20",
    "uvloop>=0.21",
    "structlog>=24.0",
    "python-dotenv>=1.0",
    "sortedcontainers>=2.4",
    "numpy>=1.26",
    "hydra-core>=1.3",
    "torch>=2.2",
    "pytorch-lightning>=2.2",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
